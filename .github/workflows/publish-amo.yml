name: Publish to AMO

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate release versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")

          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must use the v<version> format (got $RELEASE_TAG)"
            exit 1
          fi

          TAG_VERSION="${RELEASE_TAG#v}"

          if [ "$PACKAGE_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "package.json ($PACKAGE_VERSION) and manifest.json ($MANIFEST_VERSION) differ"
            exit 1
          fi

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json ($PACKAGE_VERSION) and release tag ($RELEASE_TAG) differ"
            exit 1
          fi

      - name: Lint extension
        run: yarn lint

      - name: Build extension
        run: yarn release

      - name: Sign extension on AMO
        run: >-
          yarn web-ext sign
          --source-dir .
          --artifacts-dir web-ext-artifacts
          --channel listed
          --api-key "$AMO_JWT_ISSUER"
          --api-secret "$AMO_JWT_SECRET"
          --ignore-files AGENTS.md
          --ignore-files README.md
          --ignore-files package.json
          --ignore-files yarn.lock
          --ignore-files playwright.config.js
          --ignore-files 'scripts/**'
          --ignore-files 'screenshots/**'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Attach signed extension to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" web-ext-artifacts/*.xpi --clobber
